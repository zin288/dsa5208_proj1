name: dsa5208-project1

x-mongo-common: &mongo-common
  build:
    context: .
    dockerfile: docker/mongo-lab.Dockerfile
  image: dsa5208/mongo-lab:8.0.32
  cap_add:
    - NET_ADMIN
  environment:
    TZ: UTC
  networks:
    - mongo-net

services:
  mongo1:
    <<: *mongo-common
    container_name: dsa-mongo1
    hostname: mongo1
    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
      - --port
      - "27017"
      - --oplogSize
      - "256"
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo1-data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --host 127.0.0.1 --port 27017 --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 2)'"
        ]
      interval: 5s
      timeout: 3s
      retries: 30

  mongo2:
    <<: *mongo-common
    container_name: dsa-mongo2
    hostname: mongo2
    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
      - --port
      - "27018"
      - --oplogSize
      - "256"
    ports:
      - "127.0.0.1:27018:27018"
    volumes:
      - mongo2-data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --host 127.0.0.1 --port 27018 --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 2)'"
        ]
      interval: 5s
      timeout: 3s
      retries: 30

  mongo3:
    <<: *mongo-common
    container_name: dsa-mongo3
    hostname: mongo3
    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
      - --port
      - "27019"
      - --oplogSize
      - "256"
    ports:
      - "127.0.0.1:27019:27019"
    volumes:
      - mongo3-data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --host 127.0.0.1 --port 27019 --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 2)'"
        ]
      interval: 5s
      timeout: 3s
      retries: 30

networks:
  mongo-net:
    driver: bridge

volumes:
  mongo1-data:
  mongo2-data:
  mongo3-data:
